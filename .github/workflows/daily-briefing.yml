name: Daily Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update briefing
        run: |
          echo "# Daily Briefing" > BRIEFING.md
          echo "" >> BRIEFING.md
          echo "Updated on $(date)" >> BRIEFING.md
          cp BRIEFING.md README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Daily briefing update" || echo "No changes"
          git push
