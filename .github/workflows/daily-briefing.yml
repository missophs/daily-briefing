name: Daily Briefing

on:
  schedule:
    - cron: '10 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate real briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python scripts/generate_briefing.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add BRIEFING.md README.md
          git commit -m "Daily briefing update" || echo "No changes"
          git push

      - name: Capture date for subject
        id: date
        run: echo "today=$(date +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Email completed briefing
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EMAIL_SUBJECT: "Melissa Daily Briefing - ${{ steps.date.outputs.today }}"
        run: |
          python - <<'PYMAIL'
          import os, smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          sender = os.environ["MAIL_USERNAME"]
          recipient = os.environ["MAIL_TO"]
          subject = os.environ["EMAIL_SUBJECT"]

          with open("BRIEFING.md", "r", encoding="utf-8") as f:
              html = f.read()

          msg = MIMEMultipart("alternative")
          msg["From"] = f"Melissa Daily Briefing <{sender}>"
          msg["To"] = recipient
          msg["Subject"] = subject
          msg.attach(MIMEText(html, "html", "utf-8"))

          print(f"Email from:    {sender}")
          print(f"Email to:      {recipient}")
          print(f"Email subject: {subject}")

          with smtplib.SMTP_SSL(os.environ["SMTP_SERVER"], int(os.environ["SMTP_PORT"])) as server:
              server.login(sender, os.environ["MAIL_PASSWORD"])
              result = server.sendmail(sender, [recipient], msg.as_string())

          print("SMTP sendmail returned successfully")
          print(f"SMTP result: {result}")
          print(f"Email sent → {recipient}")
          PYMAIL
