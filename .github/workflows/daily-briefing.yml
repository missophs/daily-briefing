name: Daily Briefing
on:
  workflow_dispatch:
  schedule:
      - cron: '30 7 * * *'  # Primary: 7:30 UTC = 3:30 AM EDT -- GitHub's scheduler has run 1.5-3.5h late historically (see run history); buffers for 7:30 AM EDT delivery. NOTE: shift both crons +1h UTC when DST ends in Nov (EST = UTC-5) to keep the same ET wall-clock time.
      - cron: '15 8 * * *'  # Backup: 8:15 UTC = 4:15 AM EDT -- fires if primary misses; guard skips if already sent
permissions:
  contents: write
concurrency:
  group: daily-briefing
  cancel-in-progress: false
jobs:
  update-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if briefing already sent today
        id: guard
        run: |
          git pull origin webhooks --quiet
          TODAY=$(TZ=America/New_York date +'%Y-%m-%d')
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ -f .last_briefing_date ] && [ "$(cat .last_briefing_date)" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/New_York date +'%H%M')" -lt "0700" ]; then
            # Backup schedule cron fired early (GitHub's queue delay is variable) -- skip so it
            # can't fetch Gmail before the ~7AM ET mail wave lands and lock in an incomplete briefing.
            # Only applies to schedule events; workflow_dispatch (cron-job.org's 7:00 AM ET trigger,
            # or a manual run) always proceeds.
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r scripts/requirements.txt
      - name: Generate real briefing
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -u scripts/generate_briefing.py
      - name: Capture date for subject
        if: steps.guard.outputs.skip != 'true'
        id: date
        run: echo "today=$(TZ=America/New_York date +'%Y-%m-%d %H:%M ET')" >> "$GITHUB_OUTPUT"

      - name: Email completed briefing
        if: steps.guard.outputs.skip != 'true'
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EMAIL_SUBJECT: "Melissa Daily Briefing - ${{ steps.date.outputs.today }}"
        run: |
          python - <<'PYMAIL'
          import os, smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          sender = os.environ["MAIL_USERNAME"]
          recipient = os.environ["MAIL_TO"]
          subject = os.environ["EMAIL_SUBJECT"]
          with open("BRIEFING.md", "r", encoding="utf-8") as f:
              html = f.read()
          msg = MIMEMultipart("alternative")
          msg["From"] = f"Melissa Daily Briefing <{sender}>"
          msg["To"] = recipient
          msg["Subject"] = subject
          msg.attach(MIMEText(html, "html", "utf-8"))
          print(f"Email from:    {sender}")
          print(f"Email to:      {recipient}")
          print(f"Email subject: {subject}")
          smtp_server = os.environ["SMTP_SERVER"]
          smtp_port = int(os.environ["SMTP_PORT"])
          if smtp_port == 465:
              with smtplib.SMTP_SSL(smtp_server, smtp_port, timeout=30) as server:
                  server.login(sender, os.environ["MAIL_PASSWORD"])
                  result = server.sendmail(sender, [recipient], msg.as_string())
          else:
              with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as server:
                  server.ehlo()
                  server.starttls()
                  server.ehlo()
                  server.login(sender, os.environ["MAIL_PASSWORD"])
                  result = server.sendmail(sender, [recipient], msg.as_string())
          print("SMTP sendmail returned successfully")
          print(f"SMTP result: {result}")
          print(f"Email sent to {recipient}")
          PYMAIL
      - name: Commit changes
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "${{ steps.guard.outputs.today }}" > .last_briefing_date
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add BRIEFING.md README.md .last_briefing_date
          git diff --staged --quiet || git commit -m "Daily briefing update"
          n=0
          until git pull --rebase origin webhooks && git push origin HEAD:webhooks; do
            git rebase --abort 2>/dev/null || true
            n=$((n + 1))
            [ $n -ge 3 ] && echo "Push failed after $n attempts" >&2 && exit 1
            echo "Push attempt $n failed, retrying in $((n * 2))s…"
            sleep $((n * 2))
          done
      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python - <<'PYMAIL'
          import os, smtplib
          from email.mime.text import MIMEText
          sender    = os.environ["MAIL_USERNAME"]
          recipient = os.environ["MAIL_TO"]
          subject   = "ALERT: Daily Briefing workflow FAILED — no briefing sent"
          body = (
              "The Daily Briefing GitHub Actions workflow failed. Your briefing was NOT delivered.\n\n"
              "Run log:\n"
              "https://github.com/missophs/daily-briefing/actions/workflows/daily-briefing.yml\n\n"
              "Common causes and fixes:\n"
              "  Google OAuth error (invalid_grant):\n"
              "    Run scripts/get_google_token.py and update all 3 Google secrets.\n"
              "  Anthropic API error:\n"
              "    Check ANTHROPIC_API_KEY in GitHub secrets and account credits.\n"
              "  SMTP error:\n"
              "    Check MAIL_PASSWORD, SMTP_SERVER, SMTP_PORT in GitHub secrets.\n"
          )
          msg = MIMEText(body, "plain")
          msg["From"]    = sender
          msg["To"]      = recipient
          msg["Subject"] = subject
          smtp_server = os.environ["SMTP_SERVER"]
          smtp_port   = int(os.environ["SMTP_PORT"])
          if smtp_port == 465:
              with smtplib.SMTP_SSL(smtp_server, smtp_port, timeout=30) as server:
                  server.login(sender, os.environ["MAIL_PASSWORD"])
                  server.sendmail(sender, [recipient], msg.as_string())
          else:
              with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as server:
                  server.ehlo()
                  server.starttls()
                  server.ehlo()
                  server.login(sender, os.environ["MAIL_PASSWORD"])
                  server.sendmail(sender, [recipient], msg.as_string())
          print("Failure notification sent")
          PYMAIL
