<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melissa's Daily Briefing</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    :root {
      --bg:         #f4f3f0;
      --surface:    #ffffff;
      --text:       #1a1a1a;
      --muted:      #6b7280;
      --border:     #e5e7eb;
      --red:        #dc2626;
      --red-bg:     #fef2f2;
      --yellow:     #b45309;
      --yellow-bg:  #fffbeb;
      --green:      #15803d;
      --green-bg:   #f0fdf4;
      --blue:       #1d4ed8;
      --blue-bg:    #eff6ff;
      --skill:      #6b7280;
      --skill-bg:   #f9fafb;
      --radius:     10px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: "SF Mono", "Fira Code", "Fira Mono", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 1.5rem 1rem 3rem;
    }

    #briefing {
      max-width: 820px;
      margin: 0 auto;
    }

    /* ── Top card (h1 + generated line) ── */
    #briefing > h1:first-child {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      padding: 1.5rem 1.75rem 0.25rem;
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      border-top: 4px solid var(--text);
      margin-bottom: 0;
    }

    #briefing > h1:first-child + p {
      padding: 0 1.75rem 1.25rem;
      background: var(--surface);
      border-radius: 0 0 var(--radius) var(--radius);
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    /* ── Section cards (h2 blocks) ── */
    .section-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .section-card h2 {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.65rem 1.25rem;
      margin: 0;
    }

    .section-card .section-body {
      padding: 0.25rem 1.5rem 1.25rem;
    }

    /* Color themes per section */
    .section-card.red   h2 { background: var(--red-bg);    color: var(--red);    border-left: 4px solid var(--red);    }
    .section-card.yellow h2 { background: var(--yellow-bg); color: var(--yellow); border-left: 4px solid var(--yellow); }
    .section-card.green  h2 { background: var(--green-bg);  color: var(--green);  border-left: 4px solid var(--green);  }
    .section-card.blue   h2 { background: var(--blue-bg);   color: var(--blue);   border-left: 4px solid var(--blue);   }
    .section-card.skill  h2 { background: var(--skill-bg);  color: var(--skill);  border-left: 4px solid var(--border); }

    /* ── Typography inside cards ── */
    .section-body h3 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 1.25rem 0 0.5rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }

    .section-body p { margin: 0.45rem 0; font-size: 0.92rem; }

    .section-body strong { font-weight: 600; }

    .section-body em { color: var(--muted); font-style: italic; }

    .section-body a { color: var(--blue); text-decoration: none; }
    .section-body a:hover { text-decoration: underline; }

    .section-body code {
      font-family: var(--mono);
      font-size: 0.82em;
      background: #f3f4f6;
      padding: 0.15em 0.4em;
      border-radius: 4px;
      color: #374151;
    }

    /* ── Tables ── */
    .section-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.6rem 0;
      font-size: 0.875rem;
    }

    .section-body th {
      background: #f9fafb;
      font-weight: 600;
      text-align: left;
      padding: 0.45rem 0.75rem;
      border-bottom: 2px solid var(--border);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .section-body td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .section-body tr:last-child td { border-bottom: none; }
    .section-body tr:hover td { background: #fafafa; }

    /* ── Lists ── */
    .section-body ul,
    .section-body ol {
      padding-left: 1.4rem;
      margin: 0.4rem 0;
    }

    .section-body li { margin: 0.25rem 0; font-size: 0.92rem; }

    /* ── HRs become subtle spacers ── */
    .section-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1rem 0;
    }

    /* ── Footer note (italic paragraph at bottom of briefing) ── */
    .section-body > p:last-child > em:only-child {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      margin-top: 0.75rem;
    }

    /* ── Loading / error states ── */
    #loading {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      body { padding: 1rem 0.75rem 2rem; }
      #briefing > h1:first-child { font-size: 1.3rem; padding: 1.25rem 1.25rem 0.2rem; }
      #briefing > h1:first-child + p { padding: 0 1.25rem 1rem; }
      .section-card .section-body { padding: 0.25rem 1rem 1rem; }
      .section-body table { font-size: 0.8rem; }
      .section-body th, .section-body td { padding: 0.4rem 0.5rem; }
    }
  </style>
</head>
<body>
  <div id="briefing"><div id="loading">Loading briefing…</div></div>

  <script>
    const COLOR_MAP = { '🔴': 'red', '🟡': 'yellow', '🟢': 'green', '🔵': 'blue' };

    fetch('BRIEFING.md')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(md => {
        const container = document.getElementById('briefing');
        container.innerHTML = marked.parse(md);

        // Wrap each h2 + its following siblings (until next h2/h1) in a card div
        const nodes = Array.from(container.childNodes);
        let card = null;
        let body = null;

        nodes.forEach(node => {
          if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'H2') {
            // Determine color class
            const text = node.textContent || '';
            let colorClass = 'skill';
            for (const [emoji, cls] of Object.entries(COLOR_MAP)) {
              if (text.includes(emoji)) { colorClass = cls; break; }
            }

            card = document.createElement('div');
            card.className = `section-card ${colorClass}`;
            body = document.createElement('div');
            body.className = 'section-body';

            node.parentNode.insertBefore(card, node);
            card.appendChild(node);
            card.appendChild(body);
          } else if (card && body) {
            body.appendChild(node);
          }
        });
      })
      .catch(() => {
        document.getElementById('briefing').innerHTML =
          '<div id="loading">Could not load briefing. Make sure BRIEFING.md is in the same directory.</div>';
      });
  </script>
</body>
</html>
