<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Briefing</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    :root {
      --page-bg:    #eef0f3;
      --white:      #ffffff;
      --text:       #111827;
      --muted:      #6b7280;
      --border:     #e5e7eb;
      --red:        #dc2626;
      --red-bg:     #fef2f2;
      --amber:      #d97706;
      --amber-bg:   #fffbeb;
      --green:      #16a34a;
      --green-bg:   #f0fdf4;
      --blue:       #2563eb;
      --blue-bg:    #eff6ff;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", "Fira Code", Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--page-bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Top bar ── */
    header {
      background: var(--text);
      color: var(--white);
      padding: 0 1.25rem;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    header span { opacity: 0.45; font-weight: 400; letter-spacing: 0; text-transform: none; }

    /* ── Layout ── */
    .page {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.75rem 1rem 4rem;
    }

    /* ── Title card ── */
    .title-card {
      background: var(--white);
      border-radius: 10px;
      border-top: 4px solid var(--text);
      padding: 1.5rem 1.75rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .title-card h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .title-card .meta {
      margin-top: 0.35rem;
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* ── Section cards ── */
    .card {
      background: var(--white);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .card h2 {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.6rem 1.25rem;
      margin: 0;
      border-left: 4px solid transparent;
    }

    .card-body { padding: 0.25rem 1.5rem 1.25rem; }

    /* Color variants */
    .card.red   h2 { background: var(--red-bg);   color: var(--red);   border-left-color: var(--red);   }
    .card.amber h2 { background: var(--amber-bg); color: var(--amber); border-left-color: var(--amber); }
    .card.green h2 { background: var(--green-bg); color: var(--green); border-left-color: var(--green); }
    .card.blue  h2 { background: var(--blue-bg);  color: var(--blue);  border-left-color: var(--blue);  }
    .card.muted h2 { background: #f9fafb; color: var(--muted); border-left-color: var(--border); }

    /* ── Body typography ── */
    .card-body h3 {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3rem;
      margin: 1.1rem 0 0.6rem;
    }

    .card-body p { font-size: 0.9rem; margin: 0.4rem 0; }

    .card-body strong { font-weight: 600; }

    .card-body em { color: var(--muted); font-style: italic; }

    .card-body a { color: var(--blue); text-decoration: none; }
    .card-body a:hover { text-decoration: underline; }

    .card-body code {
      font-family: var(--mono);
      font-size: 0.8em;
      background: #f3f4f6;
      border: 1px solid var(--border);
      padding: 0.1em 0.35em;
      border-radius: 3px;
    }

    .card-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0.85rem 0;
    }

    .card-body ul, .card-body ol { padding-left: 1.35rem; margin: 0.4rem 0; }
    .card-body li { font-size: 0.9rem; margin: 0.2rem 0; }

    /* ── Tables ── */
    .card-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.65rem 0;
      font-size: 0.875rem;
    }

    .card-body th {
      text-align: left;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      padding: 0.4rem 0.75rem;
      border-bottom: 2px solid var(--border);
      background: #f9fafb;
    }

    .card-body td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .card-body tr:last-child td { border-bottom: none; }
    .card-body tbody tr:nth-child(even) td { background: #fafafa; }

    /* ── Priority badges ── */
    .badge {
      display: inline-block;
      padding: 0.15em 0.55em;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .badge-high   { background: var(--red-bg);   color: var(--red);   }
    .badge-medium { background: var(--amber-bg); color: var(--amber); }
    .badge-low    { background: #f1f5f9;          color: #475569;      }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 2rem 1rem 0;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ── Loading / error ── */
    #app {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .page { padding: 1.25rem 0.75rem 3rem; }
      .title-card { padding: 1.25rem 1.25rem 1rem; }
      .title-card h1 { font-size: 1.25rem; }
      .card-body { padding: 0.25rem 1rem 1rem; }
      .card-body table { font-size: 0.8rem; }
      .card-body th, .card-body td { padding: 0.35rem 0.5rem; }
    }
  </style>
</head>
<body>
  <header>Daily Briefing <span id="header-date"></span></header>
  <div id="app">Loading briefing…</div>

  <script>
    const SECTION_COLORS = { '🔴': 'red', '🟡': 'amber', '🟢': 'green', '🔵': 'blue' };

    fetch('BRIEFING.md')
      .then(r => { if (!r.ok) throw r.status; return r.text(); })
      .then(md => {
        // Parse into a detached element, then take a static snapshot of its children
        const tmp = document.createElement('div');
        tmp.innerHTML = marked.parse(md);
        const nodes = Array.from(tmp.childNodes);

        const page = document.createElement('div');
        page.className = 'page';

        let i = 0;

        // Build the title card from h1 + the "Generated:" paragraph
        if (nodes[i]?.tagName === 'H1') {
          const titleCard = document.createElement('div');
          titleCard.className = 'title-card';
          titleCard.appendChild(nodes[i++]);

          if (nodes[i]?.tagName === 'P') {
            const meta = document.createElement('p');
            meta.className = 'meta';
            meta.innerHTML = nodes[i++].innerHTML;
            titleCard.appendChild(meta);

            // Surface the date in the top bar
            const dateMatch = meta.textContent.match(/[A-Z][a-z]+day,\s+[A-Za-z]+ \d+, \d{4}/);
            if (dateMatch) {
              document.getElementById('header-date').textContent = dateMatch[0];
              document.title = `Briefing — ${dateMatch[0]}`;
            }
          }
          page.appendChild(titleCard);
        }

        // Build one card per h2 section; skip stray HRs before the first card
        let cardBody = null;
        while (i < nodes.length) {
          const node = nodes[i++];
          const isEl = node.nodeType === Node.ELEMENT_NODE;

          if (isEl && node.tagName === 'H2') {
            let cls = 'muted';
            for (const [emoji, color] of Object.entries(SECTION_COLORS)) {
              if (node.textContent.includes(emoji)) { cls = color; break; }
            }
            const card = document.createElement('div');
            card.className = `card ${cls}`;
            cardBody = document.createElement('div');
            cardBody.className = 'card-body';
            card.appendChild(node);
            card.appendChild(cardBody);
            page.appendChild(card);
          } else if (cardBody) {
            cardBody.appendChild(node);
          } else if (isEl && node.tagName !== 'HR') {
            page.appendChild(node);
          }
        }

        // Replace plain priority text with color-coded badges
        page.querySelectorAll('.card-body td:first-child').forEach(td => {
          const t = td.textContent.trim();
          if (t === 'HIGH' || t === 'MEDIUM' || t === 'LOW') {
            td.innerHTML = `<span class="badge badge-${t.toLowerCase()}">${t}</span>`;
          }
        });

        const footer = document.createElement('footer');
        footer.textContent = 'Pulled from Gmail · Google Calendar · Generated by Claude';
        page.appendChild(footer);

        document.getElementById('app').replaceWith(page);
      })
      .catch(err => {
        document.getElementById('app').textContent =
          `Could not load briefing (${err}). Serve this folder with a local web server — file:// is blocked by the browser.`;
      });
  </script>
</body>
</html>
